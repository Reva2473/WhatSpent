name: Build WhatSpent APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Copy APK with clean filename
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/WhatSpent-v1.0.0-debug.apk

      - name: Upload WhatSpent APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhatSpent-APK
          path: dist/WhatSpent-v1.0.0-debug.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: "WhatSpent v1.0.${{ github.run_number }} (Installable APK)"
          body: |
            ### WhatSpent — Low-Battery WhatsApp Conversation Time Tracker
            Download **`WhatSpent-v1.0.0-debug.apk`** below to install directly on your Android device (Android 8.0 / API 26+).
          files: dist/WhatSpent-v1.0.0-debug.apk
          prerelease: false
